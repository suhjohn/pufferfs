name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go applications
        run: go build ./...
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            infra/pulumi/package-lock.json
            web/package-lock.json
      - name: Build Pulumi project
        working-directory: infra/pulumi
        run: npm ci && npm run build
      - name: Build web app
        working-directory: web
        run: npm ci && npm run build
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.16.0
          args: check
      - name: Check shell and Compose configuration
        run: |
          sh -n scripts/install.sh
          for script in scripts/test-e2e*.sh scripts/deploy/*.sh; do bash -n "$script"; done
          python3 -m compileall -q workers tests/e2e scripts
          docker compose --env-file /dev/null -f compose.e2e.yml config --quiet
          docker compose --env-file /dev/null -f compose.e2e.yml -f compose.e2e-index-recovery.yml config --quiet
