services:
  background:
    environment:
      PUFFERFS_EMBEDDING_BATCH_DOCUMENTS: ${PUFFERFS_EMBEDDING_BATCH_DOCUMENTS:-64}
      PUFFERFS_WORKER_CONCURRENCY: ${PUFFERFS_E2E_THROUGHPUT_CONCURRENCY:-4}
  e2e:
    environment:
      PUFFERFS_EMBEDDING_BATCH_DOCUMENTS: ${PUFFERFS_EMBEDDING_BATCH_DOCUMENTS:-64}
      PUFFERFS_E2E_THROUGHPUT_CONCURRENCY: ${PUFFERFS_E2E_THROUGHPUT_CONCURRENCY:-4}
      PUFFERFS_E2E_THROUGHPUT_REPEATS: ${PUFFERFS_E2E_THROUGHPUT_REPEATS:-2}
      PUFFERFS_E2E_THROUGHPUT_RECORDS: ${PUFFERFS_E2E_THROUGHPUT_RECORDS:-256}
      PUFFERFS_E2E_THROUGHPUT_NO_VECTOR: ${PUFFERFS_E2E_THROUGHPUT_NO_VECTOR:-false}
