[databases]
pufferfs_e2e = host=postgres port=5432 dbname=pufferfs_e2e

[pgbouncer]
listen_addr = *
listen_port = 6432
unix_socket_dir = /tmp
pidfile = /tmp/pgbouncer.pid
auth_type = plain
auth_file = /etc/pgbouncer/pgbouncer-users.txt
pool_mode = transaction
default_pool_size = 4
max_db_connections = 4
max_client_conn = 400
server_idle_timeout = 60
admin_users = postgres
stats_users = postgres
