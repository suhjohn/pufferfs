name: pufferfs-e2e

x-environment: &environment
  DATABASE_URL: postgres://postgres:e2e-only@postgres:5432/pufferfs_e2e?sslmode=disable
  PUFFERFS_DB_MAX_CONNS: '2'
  PUFFERFS_WORKER_CONCURRENCY: '4'
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://aws:4566
  AWS_BUCKET_NAME: pufferfs-e2e
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  PUFFERFS_OBSOLETE_ARTIFACT_RETENTION_SECONDS: ${PUFFERFS_OBSOLETE_ARTIFACT_RETENTION_SECONDS:-2592000}
  PUFFERFS_SOURCE_RETENTION_SECONDS: ${PUFFERFS_SOURCE_RETENTION_SECONDS:-2592000}
  PUFFERFS_ADMIN_KEY: e2e-admin-only
  PUFFERFS_CLI_MANIFEST_URL: http://aws:4566/pufferfs-e2e/releases/manifest.json
  JWT_SECRET: e2e-jwt-only-not-a-production-secret
  ENABLE_EMAIL_LOGIN: 'false'
  POSTHOG_ENABLED: 'false'
  TURBOPUFFER_API_KEY: ${TURBOPUFFER_API_KEY:-}
  # One resolved endpoint for Go and Python. Passing REGION as well makes the
  # Python SDK reject a fixed URL, even when its region argument is omitted.
  TURBOPUFFER_API_URL: ${TURBOPUFFER_API_URL:-https://${TURBOPUFFER_REGION:-gcp-us-central1}.turbopuffer.com}

x-worker-environment: &worker-environment
  <<: *environment
  DATABASE_URL: postgres://postgres:e2e-only@pgbouncer:6432/pufferfs_e2e?sslmode=disable

x-worker: &worker
  image: ${COMPOSE_PROJECT_NAME:-pufferfs-e2e}-worker
  build:
    context: .
    dockerfile: tests/e2e/Dockerfile
    target: worker
  environment: *worker-environment
  init: true
  restart: 'no'
  depends_on:
    api-ready: {condition: service_completed_successfully}
    pgbouncer: {condition: service_healthy}
  healthcheck:
    test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/role-heartbeat').stat().st_mtime < 60"]
    interval: 5s
    timeout: 5s
    retries: 24

services:
  faults:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: [-host, 0.0.0.0, -config, /config/faults.json]
    volumes:
      - ./tests/e2e/faults.json:/config/faults.json:ro
    depends_on:
      aws: {condition: service_healthy}

  postgres:
    image: postgres:17-alpine
    command: [postgres, -c, max_connections=25]
    environment:
      POSTGRES_DB: pufferfs_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d pufferfs_e2e]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
      target: pgbouncer
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -p, '6432', -U, postgres, -d, pufferfs_e2e]
      interval: 2s
      timeout: 3s
      retries: 30

  aws:
    # Last-generation community emulator, explicitly pinned. New LocalStack
    # releases require a separately provisioned auth token; never pull latest.
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      LOCALSTACK_HOST: aws:4566
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: [CMD-SHELL, 'awslocal s3api list-buckets >/dev/null']
      interval: 5s
      timeout: 10s
      retries: 30

  aws-init:
    <<: *worker
    environment:
      <<: *environment
    entrypoint: [python, /e2e/bootstrap.py]
    healthcheck: {disable: true}
    depends_on:
      aws: {condition: service_healthy}

  api:
    image: ${COMPOSE_PROJECT_NAME:-pufferfs-e2e}-go
    build: .
    environment:
      <<: *environment
      AWS_ENDPOINT_URL: http://faults:8666
    depends_on:
      postgres: {condition: service_healthy}
      aws-init: {condition: service_completed_successfully}
      faults: {condition: service_started}

  api-ready:
    <<: *worker
    entrypoint: [python, /e2e/ready.py]
    healthcheck: {disable: true}
    depends_on:
      api: {condition: service_started}

  ingestion:
    <<: *worker
    command: [ingestion]

  background:
    <<: *worker
    command: [background]

  e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
      target: runner
    profiles: [test]
    environment:
      <<: *environment
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PUFFERFS_SERVER_URL: http://api:8080
      PUFFERFS_E2E_TIMEOUT_SECONDS: ${PUFFERFS_E2E_TIMEOUT_SECONDS:-3600}
    volumes:
      - ./tests/e2e/artifacts:/artifacts
      - e2e-state:/state
      - e2e-cli:/root/.tpfs
    depends_on:
      ingestion: {condition: service_started}
      background: {condition: service_started}

volumes:
  e2e-state:
  e2e-cli:
